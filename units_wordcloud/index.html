<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMO Word Cloud</title>
    <!--
        Relative redirect: works identically on a local server, a user site and a
        project page. The previous version hard-coded "/ZMO/units_wordcloud" for
        github.io hosts, which broke if the repository was renamed or served from
        a different path.
    -->
    <meta http-equiv="refresh" content="0; url=en/">
    <link rel="canonical" href="en/">
</head>
<body>
    <p>Redirecting to the word cloud… <a href="en/">Continue in English</a> · <a href="de/">Weiter auf Deutsch</a></p>
    <script>
        // Send German-preferring visitors to the localised page. The meta refresh
        // above is the no-JavaScript fallback.
        var prefersGerman = (navigator.languages || [navigator.language || ''])
            .some(function (lang) { return String(lang).toLowerCase().startsWith('de'); });
        window.location.replace(prefersGerman ? 'de/' : 'en/');
    </script>
</body>
</html>
