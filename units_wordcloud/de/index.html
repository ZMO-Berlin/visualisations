<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMO-Wortwolke</title>
    <meta name="description" content="Interaktive Wortwolke der häufigsten Begriffe in den Forschungseinheiten des ZMO.">
    <link rel="icon" href="../../shared/icon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../shared/icon-180.png">
    <link rel="canonical" href="https://zmo-berlin.github.io/visualisations/units_wordcloud/de/">
    <link rel="alternate" hreflang="en" href="../en/">
    <link rel="alternate" hreflang="de" href="./">
    <link rel="alternate" hreflang="x-default" href="../">
    <!--
        Die einzigen absoluten URLs der Website: Ein Scraper löst nichts auf und
        führt kein JavaScript aus, die Share-Karte muss die veröffentlichte
        Adresse also ausschreiben. Ein Umzug bedeutet, diese sechs Seiten zu
        bearbeiten.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ZMO-Visualisierungen">
    <meta property="og:title" content="ZMO-Wortwolke">
    <meta property="og:description" content="Interaktive Wortwolke der häufigsten Begriffe in den Forschungseinheiten des ZMO.">
    <meta property="og:url" content="https://zmo-berlin.github.io/visualisations/units_wordcloud/de/">
    <meta property="og:image" content="https://zmo-berlin.github.io/visualisations/shared/share-card.png">
    <meta property="og:image:alt" content="Die Bildmarke des Leibniz-Zentrums Moderner Orient, daneben eine Wortwolke der häufigsten Begriffe seiner Forschung.">
    <meta property="og:locale" content="de_DE">
    <meta property="og:locale:alternate" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Tokens zuerst: jeder Wert in den beiden Dateien darunter ist dort definiert. -->
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/site-bar.css">
    <link rel="stylesheet" href="../src/styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
            integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.9/build/d3.layout.cloud.js"
            integrity="sha384-xQ341kXZh9V/CNGZ1khb5YRiKeBlXA7SHpxBWH0L87OPp97kGQ51NLAlVLaDiR0v"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <!--
        Wird im iframe ganz entfernt: auf zmo.de steht der eigene Kopfbereich
        des Instituts bereits darüber. Der Kontextstreifen darunter bleibt, denn
        er gehört zur Visualisierung und nicht zur Website.
    -->
    <div data-site-bar="wordcloud" hidden></div>

    <!-- Titel, aktuelle Einheit und die beiden Zahlen. Von ContextStrip aufgebaut. -->
    <div id="context"></div>

    <div class="controls-container">
        <div id="controls"></div>
    </div>

    <div class="content-container">
        <div class="wordcloud-container">
            <div id="wordcloud"></div>
        </div>
        <div id="wordlist"></div>
    </div>

    <div id="tooltip" role="tooltip"></div>

    <!--
        Die Seite füllt das Fenster und hat keine Fußzeile, in der der Hinweis
        stehen könnte; er sitzt deshalb in einer Ecke, welche die Wolke nicht
        erreicht. `target="_blank"`, weil diese Seite auf zmo.de auch in einem
        iframe eingebunden ist: ein Link im selben Tab würde dort die
        Visualisierung durch eine persönliche Website ersetzen.
    -->
    <p class="credit">
        Erstellt von
        <a href="https://www.frederickmadore.com/" target="_blank" rel="noopener noreferrer">Frédérick Madore</a>
    </p>

    <script type="module" src="../../shared/site-bar.js"></script>
    <script type="module" src="../src/main.js"></script>
</body>
</html>
