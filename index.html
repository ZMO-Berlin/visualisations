<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMO Visualisations</title>
    <!--
        Language-detecting redirect, the same shape each app uses one level
        down. Relative, so it works from a local server, a user site and a
        project page alike, with no host sniffing and no path to update if the
        repository is renamed.
    -->
    <meta http-equiv="refresh" content="0; url=en/">
    <link rel="canonical" href="en/">
</head>
<body>
    <p>Redirecting… <a href="en/">Continue in English</a> · <a href="de/">Weiter auf Deutsch</a></p>
    <script>
        // Send German-preferring visitors to the localised page. The meta
        // refresh above is the no-JavaScript fallback.
        var prefersGerman = (navigator.languages || [navigator.language || ''])
            .some(function (lang) { return String(lang).toLowerCase().startsWith('de'); });
        window.location.replace(prefersGerman ? 'de/' : 'en/');
    </script>
</body>
</html>
