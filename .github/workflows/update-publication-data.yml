name: Update publication data

# Re-crawls the ZMO publication register, refreshes the enrichment layers
# (zmo.de people pages, OpenAlex) and regenerates the dashboard dataset.
# Successful completion triggers the validated Deploy Pages workflow, and the
# Update themes workflow, which places new publications on the thematic map.

on:
  schedule:
    # 05:00 UTC on the 1st of each month — an hour after the word cloud refresh,
    # so the two jobs never try to push to main at the same time.
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Crawl and report, but do not commit'
        type: boolean
        default: false
      refresh_all:
        description: 'Refetch every detail page instead of reusing cached records'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize both data-refresh workflows so their commits cannot race onto main.
concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A top-up run is ~200 requests and about five minutes. A --refresh-all run
    # fetches ~2,400 pages at one every half second and takes about thirty; the
    # default 6-hour limit covers it, but this keeps a hung crawl from burning
    # them.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # Pinned to the version the pipeline is developed against.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.18.1'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The committed publications.json is the cache: a publication whose
      # listing entry is unchanged keeps the record already on disk instead of
      # having its detail page fetched again.
      - name: Crawl the publication register
        run: |
          refresh=()
          if [[ '${{ inputs.refresh_all }}' == 'true' || $(date -u +%m) =~ ^(01|04|07|10)$ ]]; then refresh+=(--refresh-all); fi
          python data_prep/scrape_publications.py "${refresh[@]}"

      # The enrichment layers. Both scripts write atomically, so a step that
      # fails leaves last month's committed file in place: a redesign of the
      # people pages or an OpenAlex outage costs this month's enrichment, not
      # the register refresh. The failure is still reported below.
      - name: Crawl the people pages
        id: people
        continue-on-error: true
        run: python data_prep/scrape_people.py

      - name: Check people identities
        if: steps.people.outcome == 'success'
        run: python data_prep/check_refresh.py people

      # Incremental by default: known matches are refreshed by id and only new
      # or changed records are searched. The quarterly full run re-searches
      # everything, as the register crawl does. OPENALEX_API_KEY (a repository
      # secret) raises the daily budget; a full run fits within a free key's.
      - name: Match the register in OpenAlex
        id: openalex
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: |
          refresh=()
          if [[ '${{ inputs.refresh_all }}' == 'true' || $(date -u +%m) =~ ^(01|04|07|10)$ ]]; then refresh+=(--refresh-all); fi
          python data_prep/enrich_openalex.py "${refresh[@]}"

      # GND subject headings for books, from the hbz union catalogue (lobid) and
      # the German National Library. Incremental like OpenAlex: only new or
      # changed ISBNs are looked up, except in the quarterly full run.
      - name: Look up library subject headings
        id: subjects
        continue-on-error: true
        run: |
          refresh=()
          if [[ '${{ inputs.refresh_all }}' == 'true' || $(date -u +%m) =~ ^(01|04|07|10)$ ]]; then refresh+=(--refresh-all); fi
          python data_prep/fetch_subjects.py "${refresh[@]}"

      - name: Report enrichment failures
        if: steps.people.outcome == 'failure' || steps.openalex.outcome == 'failure' || steps.subjects.outcome == 'failure'
        run: |
          echo "::warning::An enrichment step failed (people: ${{ steps.people.outcome }}, OpenAlex: ${{ steps.openalex.outcome }}, subjects: ${{ steps.subjects.outcome }}); the previous files were kept."
          echo "Enrichment failed — people: ${{ steps.people.outcome }}, OpenAlex: ${{ steps.openalex.outcome }}, subjects: ${{ steps.subjects.outcome }}. The previously committed files were kept." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the dashboard dataset
        run: python data_prep/generate_publication_data.py

      - name: Check refresh identities
        run: python data_prep/check_refresh.py publications

      - name: Update landing fallbacks
        run: python data_prep/update_landing.py

      - name: Test before committing data
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          python data_prep/validate_outputs.py

      - name: Summarise changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: the register is unchanged since the last run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Files changed"
              echo ''
              echo '```'
              git status --porcelain
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_prep/raw_data data_prep/reports publications_dashboard/data units_wordcloud/data en/index.html de/index.html
          git commit -m 'Refresh publication data from zmo.de' \
                     -m 'Automated monthly run of data_prep/scrape_publications.py, scrape_people.py, enrich_openalex.py, fetch_subjects.py and generate_publication_data.py.'
          # Rebase before pushing: the word cloud refresh writes to the same
          # branch, and a long crawl can outlast the gap between the two jobs.
          git pull --rebase origin main
          python data_prep/validate_outputs.py
          git push

      - name: Report dry run
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run == true
        run: |
          echo 'Dry run: changes were produced but not committed.' >> "$GITHUB_STEP_SUMMARY"
