name: Update themes

# Places publications added since the last theme fit on the thematic map:
# each gets the theme with the nearest centroid and a position beside its most
# similar neighbours (see data_prep/build_themes.py). It never re-clusters: a
# full re-fit changes the themes themselves and needs them labelled again, so
# it is a deliberate local step, not a scheduled one.

on:
  workflow_run:
    workflows: [Update publication data]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The same group as the data refreshes, so its commit cannot race theirs.
concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  place:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-themes.txt

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.18.1'

      # Before anything heavy: most months add a handful of records, some none,
      # and the model is not downloaded for nothing.
      - name: Count publications without a place
        id: pending
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          register = {r['slug'] for r in json.load(open('data_prep/raw_data/publications.json', encoding='utf-8'))['publications']}
          placed = set(json.load(open('data_prep/raw_data/themes.json', encoding='utf-8'))['records'])
          print(f"count={len(register ^ placed)}")
          PY

      - name: Install dependencies
        if: steps.pending.outputs.count != '0'
        run: pip install -r requirements-themes.txt

      # ~1.1 GB, keyed on the module that pins the model and export revisions,
      # so an upgrade cannot reuse a stale download.
      - name: Cache the embedding model
        if: steps.pending.outputs.count != '0'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: embeddinggemma-2-${{ hashFiles('data_prep/gemma_encoder.py') }}

      - name: Place new publications
        if: steps.pending.outputs.count != '0'
        run: |
          python data_prep/build_themes.py
          python data_prep/generate_publication_data.py
          python data_prep/update_landing.py

      - name: Test before committing data
        if: steps.pending.outputs.count != '0'
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          python data_prep/validate_outputs.py

      - name: Commit and push
        if: steps.pending.outputs.count != '0'
        run: |
          if [ -z "$(git status --porcelain data_prep/raw_data/themes.json publications_dashboard/data)" ]; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_prep/raw_data/themes.json publications_dashboard/data en/index.html de/index.html
          git commit -m 'Place new publications on the thematic map' \
                     -m 'Automated run of data_prep/build_themes.py (nearest-theme placement; no re-fit).'
          git pull --rebase origin main
          python data_prep/validate_outputs.py
          git push
