name: Update word cloud data

# Refreshes the corpus from zmo.de and regenerates the frequency files.
# Successful completion triggers the validated Deploy Pages workflow.

on:
  schedule:
    # 04:00 UTC on the 1st of each month.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and report, but do not commit'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize both data-refresh workflows so their commits cannot race onto main.
concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # Pinned to the version the pipeline is developed against.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache NLTK corpora
        uses: actions/cache@v6.1.0
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.18.1'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape zmo.de
        run: python data_prep/scrape_zmo.py

      - name: Generate word frequencies
        run: python data_prep/generate_word_data.py

      - name: Check refresh identities
        run: python data_prep/check_refresh.py units

      - name: Update landing fallbacks
        run: python data_prep/update_landing.py

      - name: Test before committing data
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          python data_prep/validate_outputs.py

      - name: Summarise changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: the site's text is unchanged since the last run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Files changed"
              echo ''
              echo '```'
              git status --porcelain
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_prep/raw_data publications_dashboard/data units_wordcloud/data en/index.html de/index.html
          git commit -m 'Refresh word cloud data from zmo.de' \
                     -m 'Automated monthly run of data_prep/scrape_zmo.py and data_prep/generate_word_data.py.'
          # A human commit can land during the crawl even though the two data
          # refresh workflows are serialized with each other.
          git pull --rebase origin main
          python data_prep/validate_outputs.py
          git push

      - name: Report dry run
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run == true
        run: |
          echo 'Dry run: changes were produced but not committed.' >> "$GITHUB_STEP_SUMMARY"
