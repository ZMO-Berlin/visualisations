name: Update word cloud data

# Refreshes the corpus from zmo.de and regenerates the frequency files.
# Pushing to main also republishes the GitHub Pages site, which is served from
# this branch.

on:
  schedule:
    # 04:00 UTC on the 1st of each month.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and report, but do not commit'
        type: boolean
        default: false

permissions:
  contents: write

# Never let two refreshes race each other onto main.
concurrency:
  group: update-word-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          # Pinned to the version the pipeline is developed against.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache NLTK corpora
        uses: actions/cache@v6.1.0
        with:
          path: ~/nltk_data
          key: nltk-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape zmo.de
        run: python data_prep/scrape_zmo.py

      - name: Generate word frequencies
        run: python data_prep/generate_word_data.py

      # The scraper aborts if a page yields no abstract or no projects, but it
      # cannot tell that a page returned *fewer* projects than before. A large
      # drop means the site was restructured and the selectors are only partly
      # matching, so fail rather than commit a hollowed-out corpus.
      - name: Check the corpus did not collapse
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          THRESHOLD = 0.6  # fail if a unit keeps less than 60% of its words
          failures = []

          for path in sorted(Path("data_prep/raw_data").glob("*.txt")):
              previous = subprocess.run(
                  ["git", "show", f"HEAD:{path.as_posix()}"],
                  capture_output=True,
              )
              if previous.returncode != 0:
                  print(f"{path.name}: new file, skipping check")
                  continue

              before = len(previous.stdout.decode("utf-8").split())
              after = len(path.read_text(encoding="utf-8").split())
              ratio = after / before if before else 1.0
              print(f"{path.name}: {before} -> {after} words ({ratio:.0%})")

              if before and ratio < THRESHOLD:
                  failures.append(f"{path.name} kept only {ratio:.0%} of its words")

          if failures:
              print("\nRefusing to commit:", *failures, sep="\n  - ")
              sys.exit(1)
          PY

      - name: Summarise changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes: the site's text is unchanged since the last run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Files changed"
              echo ''
              echo '```'
              git status --porcelain
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh word cloud data from zmo.de' \
                     -m 'Automated monthly run of data_prep/scrape_zmo.py and data_prep/generate_word_data.py.'
          git push

      - name: Report dry run
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run == true
        run: |
          echo 'Dry run: changes were produced but not committed.' >> "$GITHUB_STEP_SUMMARY"
