<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMO-Publikationen</title>
    <meta name="description" content="Interaktiver Überblick über die Publikationen im Verzeichnis des ZMO, nach Jahr, Dokumenttyp, Autorschaft und Publikationsorgan.">
    <link rel="icon" href="../../shared/icon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../shared/icon-180.png">
    <link rel="canonical" href="https://zmo-berlin.github.io/visualisations/publications_dashboard/de/">
    <link rel="alternate" hreflang="en" href="../en/">
    <link rel="alternate" hreflang="de" href="./">
    <link rel="alternate" hreflang="x-default" href="../">
    <!--
        Die einzigen absoluten URLs der Website: Ein Scraper löst nichts auf und
        führt kein JavaScript aus, die Share-Karte muss die veröffentlichte
        Adresse also ausschreiben. Ein Umzug bedeutet, diese sechs Seiten zu
        bearbeiten.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ZMO-Visualisierungen">
    <meta property="og:title" content="ZMO-Publikationen">
    <meta property="og:description" content="Interaktiver Überblick über die Publikationen im Verzeichnis des ZMO, nach Jahr, Dokumenttyp, Autorschaft und Publikationsorgan.">
    <meta property="og:url" content="https://zmo-berlin.github.io/visualisations/publications_dashboard/de/">
    <meta property="og:image" content="https://zmo-berlin.github.io/visualisations/shared/share-card.png">
    <meta property="og:image:alt" content="Die Bildmarke des Leibniz-Zentrums Moderner Orient.">
    <meta property="og:locale" content="de_DE">
    <meta property="og:locale:alternate" content="en_GB">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Tokens zuerst: jeder Wert in den beiden Dateien darunter ist dort definiert. -->
    <link rel="stylesheet" href="../../shared/tokens.css">
    <link rel="stylesheet" href="../../shared/site-bar.css">
    <link rel="stylesheet" href="../src/styles/main.css">
    <!--
        d3 dient hier nur einem Zweck: dem Kräfte-Layout hinter dem Graphen der
        Ko-Autorschaft. Gleiche Version und gleicher Integritäts-Hash wie in der
        Wortwolken-Anwendung, damit wer beide besucht, die Bibliothek nur einmal
        herunterlädt.
    -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
            integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <!-- Wird im iframe ganz entfernt: zmo.de hat darüber seinen eigenen Kopfbereich. -->
    <div data-site-bar="publications" hidden></div>

    <main class="dashboard">
        <header id="header" class="header"></header>
        <!--
            Eine Befehlsleiste. Der Kennzahlenstreifen, der früher zwischen
            Kopfbereich und Filtern stand, ist jetzt eine Textzeile darin —
            siehe die Anmerkung am Anfang von components/Summary.js.
        -->
        <div id="filters" class="filters"></div>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="panels" class="panels" hidden></div>
        <footer class="dashboard__footer">
            <div id="credit"></div>
        </footer>
    </main>

    <script type="module" src="../../shared/site-bar.js"></script>
    <script type="module" src="../src/main.js"></script>
</body>
</html>
